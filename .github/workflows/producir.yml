name: Producir video

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install -r requirements.txt

      - name: Preparar credenciales YouTube
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 -c "
import os, base64, json
t = os.environ['YT_TOKEN'].strip()
data = base64.b64decode(t + '==').decode()
open('/tmp/yt_token.json','w').write(data)
s = os.environ['YT_CLIENT_SECRET'].strip()
open('/tmp/yt_client_secret.json','w').write(s)
print('Credenciales OK')
"

      - name: Ejecutar pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_TOKEN_FILE: /tmp/yt_token.json
          YT_SECRET_FILE: /tmp/yt_client_secret.json
        run: |
          cd scripts
          python producir.py

      - name: Guardar estado de la serie
        run: |
          git config user.name "el-engranaje-bot"
          git config user.email "actions@github.com"
          git add config/estado_serie.json || true
          git diff --staged --quiet || git commit -m "estado: actualiza serie [skip ci]"
          git push || true
